<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anime Fan Club</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-image: url('ani2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            color: white;
        }

        .card h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
        }

        .card .form-label {
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .card .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 45px 12px 20px;
            height: 50px;
            width: 100%;
        }

        .card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .card .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            pointer-events: none;
        }

        .card .links {
            text-align: center;
            margin-top: 20px;
        }

        .card .links a {
            color: white;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            background-color: #007bff;
            border-color: #007bff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Para sa Social Buttons */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .social-buttons a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .social-buttons a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="card">

    <h1>One Piece Fan Club</h1>
    <p>Welcome back! Please login.</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
            <i class="fa-solid fa-envelope input-icon"></i>
        </div>

        <div class="input-group">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
            <i class="fa-solid fa-lock input-icon"></i>
        </div>

        <small id="loginError" style="color: #ff6b6b; display: none; margin-bottom: 10px;">
            Incorrect email or password. You have <span id="attemptsLeft">5</span> attempts left.
        </small>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
    </form>

    <!-- Social Buttons (Functional Links) -->
    <div class="social-buttons">
        <a href="https://www.google.com" target="_blank">
            <img src="google.jpg" alt="Google" style="width: 25px; height: 25px;">
        </a>
        <a href="https://www.facebook.com" target="_blank">
            <img src="facebook.png" alt="Facebook" style="width: 25px; height: 25px;">
        </a>
    </div>

    <!-- Link to Register Page -->
    <div class="links">
        <a href="register.html">Don't have an account? Register</a>
    </div>

</div>

<script>
    // 🔑 Change these to your real credentials later
    const CORRECT_EMAIL = "admin@anime.com";
    const CORRECT_PASSWORD = "anime12345";

    let attempts = 5;

    const loginForm = document.getElementById("loginForm");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginError = document.getElementById("loginError");
    const attemptsLeft = document.getElementById("attemptsLeft");
    const loginBtn = document.getElementById("loginBtn");

    loginForm.addEventListener("submit", function (e) {
        e.preventDefault(); // stop form from submitting normally

        const email = loginEmail.value.trim();
        const password = loginPassword.value;

        // ✅ Correct login
        if (email === CORRECT_EMAIL && password === CORRECT_PASSWORD) {
            loginError.style.display = "none";
            window.location.href = "index.html"; // go to home page
            return;
        }

        // ❌ Wrong login
        attempts--;
        attemptsLeft.textContent = attempts;
        loginError.style.display = "block";

        // Clear the password field for security
        loginPassword.value = "";
        loginPassword.focus();

        // 🚫 No attempts left — disable everything
        if (attempts <= 0) {
            loginEmail.disabled = true;
            loginPassword.disabled = true;
            loginBtn.disabled = true;
            loginBtn.textContent = "Account Locked";
            loginError.innerHTML = "Too many failed attempts. Login disabled. Please refresh to try again.";
        }
    });
</script>

</body>
</html>
