<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Anime Fan Club</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-image: url('ani1.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 620px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            color: white;
        }

        .card h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
        }

        .card .form-label {
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .card .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 45px 12px 20px;
            height: 50px;
            width: 100%;
        }

        .card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .card .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            pointer-events: none;
        }

        .card .links {
            text-align: center;
            margin-top: 20px;
        }

        .card .links a {
            color: white;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            background-color: #007bff;
            border-color: #007bff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Para sa Social Buttons */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .social-buttons a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .social-buttons a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="card">

    <h1>One Piece Fan Club</h1>
    <p>Join us now!</p>

    <form>
        <div class="input-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
            <i class="fa-solid fa-user input-icon"></i>
        </div>

        <div class="input-group">
            <label for="regEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
            <i class="fa-solid fa-envelope input-icon"></i>
        </div>

        <div class="input-group">
            <label for="regPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="regPassword" placeholder="Create a password" required>
            <i class="fa-solid fa-lock input-icon"></i>
        </div>
        <small id="passwordError" style="color: #ff6b6b; display: none; margin-top: -10px; margin-bottom: 10px;">
            Password must be at least 8 characters.
        </small>

        <div class="input-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
            <i class="fa-solid fa-lock input-icon"></i>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="terms" required>
            <label class="form-check-label" for="terms">I agree to the Terms</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <!-- Social Buttons (Functional Links) -->
    <div class="social-buttons">
        <a href="https://www.google.com" target="_blank">
            <img src="google.jpg" alt="Google" style="width: 25px; height: 25px;">
        </a>
        <a href="https://www.facebook.com" target="_blank">
            <img src="facebook.png" alt="Facebook" style="width: 25px; height: 25px;">
        </a>
    </div>

    <!-- Link to Login Page -->
    <div class="links">
        <a href="login.html">Already have an account? Login</a>
    </div>

</div>

<script>
    const password = document.getElementById("regPassword");
    const passwordError = document.getElementById("passwordError");

    password.addEventListener("input", function () {
        if (password.value.length > 0 && password.value.length < 8) {
            passwordError.style.display = "block";
        } else {
            passwordError.style.display = "none";
        }
    });
</script>

</body>
</html>
